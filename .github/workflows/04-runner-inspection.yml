name: 04 runner-inspection.yml

on:
  workflow_dispatch:


jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Display runner infos
        run: echo "${{ runner.os }} ${{ runner.arch }}"

      - name: Node Version
        run: node --version

      - uses: actions/setup-node@v7

      - name: Node Version
        run: node --version

