name: 09 Reusable workflow

on:
  workflow_call:
    outputs:
      label:
        description: A output label from a job output
        value: ${{ jobs.job_output.outputs.label }}

jobs:
  job_output:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.labal-step.label }}
    steps:
      - name: set a output on a step
        id: labal-step
        run: echo 'label="Build label" >> $GITHUB_OUTPUT'