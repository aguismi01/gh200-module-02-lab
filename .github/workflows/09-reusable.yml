name: 09 Reusable workflow

on:
  workflow_call:
    outputs:
      label:
        description: A output label from a job output
        value: ${{ jobs.job_output.outputs.label }}

jobs:
  job_output:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.step1_job_output.label }}
    steps:
      - id: step1_job_output
        name: set a output on a step
        run: echo "label=Build-v1" >> "$GITHUB_OUTPUT"