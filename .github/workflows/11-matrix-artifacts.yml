name: 11 matrix-artifacts

on: push

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
    name: build-job-on-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
      - run: |
          mkdir -p reports
          echo "Report ${{ matrix.node }}" >> reports/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: node-report-${{ matrix.node }}
          path: reports
          retention-days: 1
      - uses: actions/download-artifact@v4
        with:
          name: node-report-${{ matrix.node }}
          path: downloads
      
      - name: Display node v-${{ matrix.node }} report
        run: cat downloads/report.txt