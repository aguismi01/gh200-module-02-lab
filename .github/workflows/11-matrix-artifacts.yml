name: 11 matrix-artifacts

on: push

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24]
    name: build-job-on-${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: |
          mkdir -p reports
          echo "Report ${{ matrix.node }}" >> reports/report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: node-report-${{ matrix.node }}
          path: reports
          retention-days: 1


  inspect:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      
      - name: Display report files
        run: ls -la downloads

      - name: Display the content of reports
        run: cat downloads/node-report-*/report.txt