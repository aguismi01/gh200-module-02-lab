name: 16 module-02-capstone

on: workflow_dispatch

jobs:
  test:
    strategy:
      matrix:
        node: [20, 22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: 
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test > test-result.txt
      - run: |
          mkdir -p dist
          echo "Node Version is ${{ matrix.node }}" > dist/test-report.txt
          cat test-result.txt >> dist/test-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: test-report-${{ matrix.node }}
          path: dist
          retention-days: 1
  
  database-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: lab-only-password
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab -d app_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: pg_isready -h 127.0.0.1 -p 5432 -U lab -d app_test
    
  prepare:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.output.outputs.tag }}
    steps:
      - name: set an output
        id: output
        run: echo "tag=lab-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

  report:
    runs-on: ubuntu-latest
    needs: [test, database-check, prepare]
    env:
      TAG: ${{ needs.prepare.outputs.image_tag }}
    steps:
      - name: Read output from prepare job
        run: echo "Output from prepate job $TAG"
      - uses: actions/download-artifact@v4
        with:
          path: downloads
      - run: |
          ls -la downloads
          cat downloads/test-report-*/test-report.txt
          echo "## Tag output: $TAG" >> "$GITHUB_STEP_SUMMARY"
        